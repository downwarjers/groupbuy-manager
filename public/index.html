<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>團購管理系統</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased select-none pb-24">
    <!-- Header -->
    <header
      class="bg-blue-600 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center"
    >
      <h1 class="text-xl font-bold tracking-wider">團購管理系統</h1>
      <div class="flex gap-2">
        <input type="file" id="file-import-backup" accept=".json,application/json" class="hidden" />
        <button
          id="btn-import-backup"
          class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg border border-blue-400"
        >
          匯入 JSON
        </button>
        <button
          id="btn-export-backup"
          class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg border border-blue-400"
        >
          匯出 JSON
        </button>
        <button
          id="btn-sync"
          class="text-xs bg-emerald-500 hover:bg-emerald-600 px-3 py-1.5 rounded-lg font-bold shadow"
        >
          雲端同步
        </button>
      </div>
    </header>

    <!-- Main Views -->
    <main class="p-4 max-w-4xl mx-auto space-y-4">
      <section
        class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center"
      >
        <div>
          <div class="font-bold text-sm text-slate-900">自動彙整採購建議</div>
          <div class="text-xs text-slate-500">比對庫存與待處理需求量</div>
        </div>
        <button
          id="btn-consolidate-purchase"
          class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow"
        >
          一鍵生成採購單
        </button>
      </section>

      <!-- 1. 商品管理 -->
      <section id="view-products" class="tab-content block space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold">商品管理</h2>
          <button
            id="btn-open-create-product"
            class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold shadow"
          >
            + 新增商品
          </button>
        </div>
        <div class="flex gap-2">
          <input
            id="search-product"
            type="text"
            placeholder="搜尋商品名稱..."
            class="flex-1 border p-2 rounded-lg text-xs bg-white"
          />
          <select id="sort-product" class="border p-2 rounded-lg text-xs bg-white">
            <option value="name_asc">依名稱 (A-Z)</option>
            <option value="name_desc">依名稱 (Z-A)</option>
            <option value="date_desc">依更新時間 (新到舊)</option>
          </select>
        </div>
        <div id="list-products" class="space-y-3"></div>
      </section>

      <!-- 2. 客戶訂單管理 -->
      <section id="view-orders" class="tab-content hidden space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold">客戶訂單</h2>
          <button
            id="btn-open-create-sales"
            class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold shadow"
          >
            + 新增訂單
          </button>
        </div>
        <div class="flex gap-2">
          <input
            id="search-sales"
            type="text"
            placeholder="搜尋單號或客戶..."
            class="flex-1 border p-2 rounded-lg text-xs bg-white"
          />
          <select id="filter-sales-status" class="border p-2 rounded-lg text-xs bg-white">
            <option value="ALL">全部狀態</option>
            <option value="PENDING">待處理</option>
            <option value="PREPARING">備貨中</option>
            <option value="PARTIALLY_SHIPPED">部分出貨</option>
            <option value="SHIPPED">已出貨</option>
            <option value="COMPLETED">已結案</option>
            <option value="CANCELLED">已取消</option>
          </select>
          <select id="sort-sales" class="border p-2 rounded-lg text-xs bg-white">
            <option value="date_desc">依日期 (新到舊)</option>
            <option value="date_asc">依日期 (舊到新)</option>
            <option value="amount_desc">依金額 (大到小)</option>
          </select>
        </div>
        <div id="list-sales-orders" class="space-y-3"></div>
      </section>

      <!-- 3. 進貨訂單管理 -->
      <section id="view-purchases" class="tab-content hidden space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold">進貨訂單</h2>
          <button
            id="btn-open-create-purchase"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold shadow"
          >
            + 新增進貨
          </button>
        </div>
        <div class="flex gap-2">
          <input
            id="search-purchase"
            type="text"
            placeholder="搜尋進貨單或廠商..."
            class="flex-1 border p-2 rounded-lg text-xs bg-white"
          />
          <select id="filter-purchase-status" class="border p-2 rounded-lg text-xs bg-white">
            <option value="ALL">全部狀態</option>
            <option value="PENDING">待叫貨(草稿)</option>
            <option value="ORDERED">已叫貨</option>
            <option value="PARTIALLY_RECEIVED">部分到貨</option>
            <option value="RECEIVED">已完成</option>
            <option value="CANCELLED">已取消</option>
          </select>
          <select id="sort-purchase" class="border p-2 rounded-lg text-xs bg-white">
            <option value="date_desc">依日期 (新到舊)</option>
            <option value="date_asc">依日期 (舊到新)</option>
            <option value="cost_desc">依進貨金額 (大到小)</option>
          </select>
        </div>
        <div id="list-purchase-orders" class="space-y-3"></div>
      </section>

      <!-- 4. 名冊管理 -->
      <section id="view-members" class="tab-content hidden space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold">成員名冊</h2>
          <div class="flex gap-2">
            <button
              id="btn-open-create-customer"
              class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold"
            >
              + 新增客戶
            </button>
            <button
              id="btn-open-create-supplier"
              class="bg-gray-700 hover:bg-gray-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold"
            >
              + 新增廠商
            </button>
          </div>
        </div>
        <div class="flex gap-2">
          <input
            id="search-member"
            type="text"
            placeholder="搜尋姓名、電話、地址..."
            class="flex-1 border p-2 rounded-lg text-xs bg-white"
          />
          <select id="sort-member" class="border p-2 rounded-lg text-xs bg-white">
            <option value="name_asc">依姓名 (A-Z)</option>
            <option value="date_desc">依更新時間 (新到舊)</option>
          </select>
        </div>
        <div class="space-y-4">
          <div>
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
              客戶清單 (Customers)
            </h3>
            <div id="list-customers" class="space-y-2"></div>
          </div>
          <div>
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
              供應商清單 (Suppliers)
            </h3>
            <div id="list-suppliers" class="space-y-2"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav
      class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 grid grid-cols-4 py-2 px-1 z-30 shadow-lg text-center"
    >
      <button id="nav-btn-view-products" class="text-blue-600 flex flex-col items-center">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
          />
        </svg>
        <span class="text-[11px] font-bold mt-1">商品管理</span>
      </button>
      <button id="nav-btn-view-orders" class="text-slate-400 flex flex-col items-center">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"
          />
        </svg>
        <span class="text-[11px] font-bold mt-1">訂單管理</span>
      </button>
      <button id="nav-btn-view-purchases" class="text-slate-400 flex flex-col items-center">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
          />
        </svg>
        <span class="text-[11px] font-bold mt-1">進貨管理</span>
      </button>
      <button id="nav-btn-view-members" class="text-slate-400 flex flex-col items-center">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
          />
        </svg>
        <span class="text-[11px] font-bold mt-1">成員名冊</span>
      </button>
    </nav>

    <!-- Modal: Product -->
    <div
      id="modal-product"
      class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
        <h3 id="modal-product-title" class="text-lg font-bold mb-3">新增/編輯商品</h3>
        <input type="hidden" id="prod-id" />
        <div class="space-y-3">
          <input
            id="prod-name"
            type="text"
            placeholder="商品主名稱"
            class="w-full border p-2.5 rounded-lg text-sm"
          />
          <textarea
            id="prod-desc"
            rows="2"
            placeholder="商品備註..."
            class="w-full border p-2.5 rounded-lg text-sm"
          ></textarea>
          <div class="border-t pt-3">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-bold text-slate-700">規格項目 (SKU)</span>
              <button
                type="button"
                id="btn-add-variant"
                class="text-xs text-blue-600 font-semibold"
              >
                + 新增規格
              </button>
            </div>
            <div id="product-variants-container" class="space-y-2"></div>
          </div>
        </div>
        <div class="flex gap-2 mt-6">
          <button
            id="btn-close-modal-product"
            class="w-1/2 py-2 bg-slate-200 rounded-lg font-bold text-sm"
          >
            取消
          </button>
          <button
            id="btn-save-product"
            class="w-1/2 py-2 bg-blue-600 text-white rounded-lg font-bold text-sm"
          >
            儲存商品
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Customer -->
    <div
      id="modal-customer"
      class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
        <h3 id="modal-customer-title" class="text-lg font-bold mb-4">新增/編輯客戶</h3>
        <input type="hidden" id="cust-id" />
        <div class="space-y-2.5">
          <input
            id="cust-name"
            type="text"
            placeholder="客戶姓名 *"
            class="w-full border p-2 rounded-lg text-sm"
          />
          <div class="grid grid-cols-2 gap-2">
            <input
              id="cust-phone"
              type="tel"
              placeholder="行動電話 *"
              class="w-full border p-2 rounded-lg text-sm"
            />
            <input
              id="cust-tel"
              type="tel"
              placeholder="市內電話"
              class="w-full border p-2 rounded-lg text-sm"
            />
          </div>
          <input
            id="cust-email"
            type="email"
            placeholder="電子郵件"
            class="w-full border p-2 rounded-lg text-sm"
          />
          <input
            id="cust-address"
            type="text"
            placeholder="地址"
            class="w-full border p-2 rounded-lg text-sm"
          />
          <input
            id="cust-birthday"
            type="date"
            placeholder="生日"
            class="w-full border p-2 rounded-lg text-sm"
          />
          <input
            id="cust-note"
            type="text"
            placeholder="備註"
            class="w-full border p-2 rounded-lg text-sm"
          />
        </div>
        <div class="flex gap-2 mt-5">
          <button
            id="btn-close-modal-customer"
            class="w-1/2 py-2 bg-slate-200 rounded-lg font-bold text-sm"
          >
            取消
          </button>
          <button
            id="btn-save-customer"
            class="w-1/2 py-2 bg-blue-500 text-white rounded-lg font-bold text-sm"
          >
            儲存客戶
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Supplier -->
    <div
      id="modal-supplier"
      class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
        <h3 id="modal-supplier-title" class="text-lg font-bold mb-4">新增/編輯廠商</h3>
        <input type="hidden" id="sup-id" />
        <div class="space-y-2.5">
          <input
            id="sup-name"
            type="text"
            placeholder="廠商名稱 *"
            class="w-full border p-2 rounded-lg text-sm"
          />
          <input
            id="sup-contact"
            type="text"
            placeholder="聯絡人"
            class="w-full border p-2 rounded-lg text-sm"
          />
          <div class="grid grid-cols-2 gap-2">
            <input
              id="sup-tel"
              type="tel"
              placeholder="公司電話"
              class="w-full border p-2 rounded-lg text-sm"
            />
            <input
              id="sup-phone"
              type="tel"
              placeholder="行動電話"
              class="w-full border p-2 rounded-lg text-sm"
            />
          </div>
          <p class="text-[11px] text-amber-600 font-medium">* 電話至少擇一填寫</p>
          <input
            id="sup-email"
            type="email"
            placeholder="廠商 Email"
            class="w-full border p-2 rounded-lg text-sm"
          />
          <input
            id="sup-address"
            type="text"
            placeholder="廠商通訊地址"
            class="w-full border p-2 rounded-lg text-sm"
          />
        </div>
        <div class="flex gap-2 mt-5">
          <button
            id="btn-close-modal-supplier"
            class="w-1/2 py-2 bg-slate-200 rounded-lg font-bold text-sm"
          >
            取消
          </button>
          <button
            id="btn-save-supplier"
            class="w-1/2 py-2 bg-gray-700 text-white rounded-lg font-bold text-sm"
          >
            儲存廠商
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Sales Order -->
    <div
      id="modal-sales"
      class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-2xl w-full max-w-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto"
      >
        <h3 id="modal-sales-title" class="text-lg font-bold mb-3">新增/編輯客戶訂單</h3>
        <input type="hidden" id="sales-order-id" />
        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div class="relative">
              <input type="hidden" id="sales-customer-id" />
              <input
                id="sales-customer-input"
                list="sales-customer-datalist"
                placeholder="選擇客戶..."
                class="w-full border p-2 rounded-lg text-sm bg-white"
              />
              <datalist id="sales-customer-datalist"></datalist>
            </div>
            <input
              id="sales-order-datetime"
              type="datetime-local"
              step="1"
              class="w-full border p-2 rounded-lg text-sm"
            />
          </div>
          <div class="border rounded-lg p-3 bg-slate-50 space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-700">選購品項</span>
              <button
                type="button"
                id="btn-add-sales-item"
                class="text-xs text-emerald-600 font-semibold"
              >
                + 追加品項
              </button>
            </div>
            <div id="sales-items-container" class="space-y-2"></div>
            <div class="text-right text-sm font-bold pt-2 border-t text-slate-700">
              訂單合計: $<span id="sales-total-amount">0</span>
            </div>
          </div>
        </div>
        <div class="flex gap-2 mt-5">
          <button
            id="btn-close-modal-sales"
            class="w-1/2 py-2 bg-slate-200 rounded-lg font-bold text-sm"
          >
            取消
          </button>
          <button
            id="btn-save-sales"
            class="w-1/2 py-2 bg-emerald-600 text-white rounded-lg font-bold text-sm"
          >
            儲存訂單
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Shipment (分批出貨) -->
    <div
      id="modal-shipment"
      class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
        <h3 id="modal-shipment-title" class="text-lg font-bold mb-2 text-slate-800">
          訂單出貨處理
        </h3>
        <p class="text-xs text-slate-500 mb-3">
          指定本次要送出的商品數量。支援分批出貨，出庫數量不能大於現有庫存。
        </p>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <input
            id="shipment-carrier"
            type="text"
            placeholder="物流方式 (例: 7-11/自取)"
            class="border p-2 rounded-lg text-xs"
          />
          <input
            id="shipment-tracking"
            type="text"
            placeholder="物流單號 (選填)"
            class="border p-2 rounded-lg text-xs"
          />
        </div>
        <input
          id="shipment-note"
          type="text"
          placeholder="出貨備註 (選填)"
          class="w-full border p-2 rounded-lg text-xs mb-3"
        />
        <div id="shipment-items-container" class="space-y-3"></div>
        <div class="flex gap-2 mt-6">
          <button
            id="btn-close-modal-shipment"
            class="w-1/2 py-2 bg-slate-200 rounded-lg font-bold text-sm text-slate-700"
          >
            取消
          </button>
          <button
            id="btn-confirm-shipment"
            class="w-1/2 py-2 bg-purple-600 text-white rounded-lg font-bold text-sm shadow hover:bg-purple-700"
          >
            確認本次出庫
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Purchase Order -->
    <div
      id="modal-purchase"
      class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-2xl w-full max-w-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto"
      >
        <h3 id="modal-purchase-title" class="text-lg font-bold mb-3">新增/編輯進貨單</h3>
        <input type="hidden" id="purchase-order-id" />
        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div class="relative">
              <input type="hidden" id="purchase-supplier-id" />
              <input
                id="purchase-supplier-input"
                list="purchase-supplier-datalist"
                placeholder="選擇供應商..."
                class="w-full border p-2 rounded-lg text-sm bg-white"
              />
              <datalist id="purchase-supplier-datalist"></datalist>
            </div>
            <input
              id="purchase-order-datetime"
              type="datetime-local"
              step="1"
              class="w-full border p-2 rounded-lg text-sm"
            />
          </div>
          <div class="border rounded-lg p-3 bg-slate-50 space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-700">採購明細</span>
              <button
                type="button"
                id="btn-add-purchase-item"
                class="text-xs text-indigo-600 font-semibold"
              >
                + 追加進貨項目
              </button>
            </div>
            <div id="purchase-items-container" class="space-y-2"></div>
            <div class="text-right text-sm font-bold pt-2 border-t text-slate-700">
              進貨總額: $<span id="purchase-total-cost">0</span>
            </div>
          </div>
        </div>
        <div class="flex gap-2 mt-5">
          <button
            id="btn-close-modal-purchase"
            class="w-1/2 py-2 bg-slate-200 rounded-lg font-bold text-sm"
          >
            取消
          </button>
          <button
            id="btn-save-purchase"
            class="w-1/2 py-2 bg-indigo-600 text-white rounded-lg font-bold text-sm"
          >
            儲存進貨單
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Import Backup Mode -->
    <div
      id="modal-import-mode"
      class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-4">
        <h3 class="text-base font-bold text-slate-800">選擇匯入備份模式</h3>
        <div class="space-y-2 text-xs">
          <label
            class="flex items-start gap-2 p-2 border rounded-lg hover:bg-slate-50 cursor-pointer"
          >
            <input type="radio" name="import-mode" value="replace" class="mt-0.5" />
            <div>
              <span class="font-bold text-red-600 block">完全覆蓋 (Replace)</span>
              <span class="text-slate-500 text-[11px]">清空當前本機所有資料，以備份覆蓋。</span>
            </div>
          </label>
          <label
            class="flex items-start gap-2 p-2 border rounded-lg hover:bg-slate-50 cursor-pointer"
          >
            <input type="radio" name="import-mode" value="merge-overwrite" checked class="mt-0.5" />
            <div>
              <span class="font-bold text-slate-800 block"
                >合併並覆蓋重疊 ID (Merge Overwrite)</span
              >
              <span class="text-slate-500 text-[11px]">保留本機獨有資料，相同 ID 則覆蓋。</span>
            </div>
          </label>
          <label
            class="flex items-start gap-2 p-2 border rounded-lg hover:bg-slate-50 cursor-pointer"
          >
            <input type="radio" name="import-mode" value="merge-skip" class="mt-0.5" />
            <div>
              <span class="font-bold text-slate-800 block">合併並保留本機重疊 (Merge Skip)</span>
              <span class="text-slate-500 text-[11px]">僅匯入 ID 不重複的新項目。</span>
            </div>
          </label>
        </div>
        <div class="flex gap-2">
          <button
            id="btn-cancel-import-mode"
            class="w-1/2 py-2 bg-slate-200 rounded-lg font-bold text-xs"
          >
            取消
          </button>
          <button
            id="btn-confirm-import-mode"
            class="w-1/2 py-2 bg-blue-600 text-white rounded-lg font-bold text-xs"
          >
            確認匯入
          </button>
        </div>
      </div>
    </div>

    <!-- Modal: Receive Verification -->
    <div
      id="modal-receive"
      class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
        <h3 id="modal-receive-title" class="text-lg font-bold mb-2 text-slate-800">到貨清點入庫</h3>
        <p class="text-xs text-slate-500 mb-3">
          輸入當前已累積實際收到的數量。未結案前隨時可再次點擊清點修正。
        </p>
        <div id="receive-items-container" class="space-y-3"></div>
        <div class="flex gap-2 mt-6">
          <button
            id="btn-close-modal-receive"
            class="w-1/2 py-2 bg-slate-200 rounded-lg font-bold text-sm text-slate-700"
          >
            關閉
          </button>
          <button
            id="btn-confirm-receive"
            class="w-1/2 py-2 bg-emerald-600 text-white rounded-lg font-bold text-sm shadow hover:bg-emerald-700"
          >
            儲存清點
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
